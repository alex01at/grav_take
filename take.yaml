name: Take
version: 0.1.0
description: Eintragungslisten für Feiern – Anmeldung per Formular im Frontend, Verwaltung in der Administration, Anzeige per Shortcode.
icon: glass-cheers
author:
  name: Alex
homepage: https://github.com/alex01at/grav_take
demo: ''
keywords: grav, plugin, event, feier, potluck, anmeldung
bugs: https://github.com/alex01at/grav_take/issues
license: MIT

dependencies:
  - { name: grav, version: '>=1.7.0' }
  - { name: admin, version: '>=1.10.0' }
  - { name: shortcode-core, version: '>=5.0.0' }

form:
  validation: strict
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
